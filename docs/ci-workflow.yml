name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hft-tests:
    name: HFT Suite (models + risk governors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: HFT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run HFT test suite
        run: python -m pytest tests/ -v

      - name: Secret hygiene check
        run: |
          # Fail CI if any Delta-style credential is hardcoded in the tree.
          # Guards against regression of the 2026-11 leaked-credential incident.
          if grep -rn --include="*.py" -E "(api_secret|API_SECRET)[\"' ]*[:=][\"' ]*[A-Za-z0-9]{25,}" . \
             | grep -v -E "os\.getenv|\.env|API_SECRET_DEFAULT|import|def |#"; then
            echo "::error::Hardcoded API secret detected — move it to environment variables"
            exit 1
          fi
          echo "Secret hygiene: PASS"

  delta-fib-tests:
    name: Delta-Fibonacci Suite (engine, MT5-free subset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Delta-Fibonacci-Institutional-Business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MT5-free dependencies
        run: |
          # MetaTrader5 / kaizen-agent are Windows-host or optional packages;
          # the engine imports degrade gracefully and their tests skip.
          grep -v -E "MetaTrader5|kaizen-agent" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Run Delta-Fibonacci test suite
        run: python -m pytest tests/ -v

  secret-scan:
    name: Repo-wide secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

